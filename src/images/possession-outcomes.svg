<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Bar chart of where 2,324 attacking sequences ended at UEFA Euro 2020: broke down before the box 65 per cent, ball delivered into the box 21 per cent, shot 12 per cent, goal 2 per cent.">
  <style>
    /* An embedded image cannot see the page's theme toggle, only the OS
       setting, so the figure paints its own surface and stays legible
       either way. */
    .viz { --surface: #fcfcfc; --text-1: #333333; --text-2: #5f5f5f; --grid: #e0e0e0; --series-1: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .viz { --surface: #1b1d21; --text-1: #e9e9e9; --text-2: #adadad; --grid: #3a3e46; --series-1: #3987e5; }
    }
    .surface { fill: var(--surface); }
    .t1 { fill: var(--text-1); }
    .t2 { fill: var(--text-2); }
    .bar { fill: var(--series-1); }
    .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 19px; font-weight: 600; }
    .sub, .note { font-size: 13px; }
    .cat { font-size: 15px; }
    .val { font-size: 15px; font-weight: 600; }
    .tick { font-size: 12px; }
  </style>
  <g class="viz">
    <rect class="surface" x="0" y="0" width="760" height="300" rx="4" />
    <text class="title t1" x="20" y="26">Where 2,324 attacking sequences ended</text>
    <text class="sub t2" x="20" y="48">UEFA Euro 2020. Each sequence counts once, at its best outcome.</text>

    <g class="grid">
      <line x1="248" y1="66" x2="248" y2="242" />
      <line x1="367" y1="66" x2="367" y2="242" />
      <line x1="486" y1="66" x2="486" y2="242" />
      <line x1="605" y1="66" x2="605" y2="242" />
      <line x1="724" y1="66" x2="724" y2="242" />
    </g>

    <text class="cat t1" x="232" y="93" text-anchor="end">Broke down before the box</text>
    <path class="bar" d="M248,78 H553 a4,4 0 0 1 4,4 V94 a4,4 0 0 1 -4,4 H248 Z" />
    <text class="val t1" x="567" y="93">65%</text>

    <text class="cat t1" x="232" y="137" text-anchor="end">Ball delivered into the box</text>
    <path class="bar" d="M248,122 H344 a4,4 0 0 1 4,4 V138 a4,4 0 0 1 -4,4 H248 Z" />
    <text class="val t1" x="358" y="137">21%</text>

    <text class="cat t1" x="232" y="181" text-anchor="end">Shot</text>
    <path class="bar" d="M248,166 H301 a4,4 0 0 1 4,4 V182 a4,4 0 0 1 -4,4 H248 Z" />
    <text class="val t1" x="315" y="181">12%</text>

    <text class="cat t1" x="232" y="225" text-anchor="end">Goal</text>
    <path class="bar" d="M248,210 H254 a4,4 0 0 1 4,4 V226 a4,4 0 0 1 -4,4 H248 Z" />
    <text class="val t1" x="268" y="225">2%</text>

    <line class="grid" x1="248" y1="242" x2="724" y2="242" />
    <text class="tick t2" x="248" y="262" text-anchor="middle">0</text>
    <text class="tick t2" x="367" y="262" text-anchor="middle">25</text>
    <text class="tick t2" x="486" y="262" text-anchor="middle">50</text>
    <text class="tick t2" x="605" y="262" text-anchor="middle">75</text>
    <text class="tick t2" x="724" y="262" text-anchor="middle">100%</text>

    <text class="note t2" x="20" y="288">Per cent of sequences. Source: Maneiro et al., Apunts Educacio Fisica i Esports 162 (2025).</text>
  </g>
</svg>
