<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#393e46" />
        <meta name="color-scheme" content="light dark" />
        <meta
            name="description"
            content="Henrik Klev: senior backend developer in Oslo, Norway. Kotlin, Android, fintech and secure communication."
        />
        <link rel="apple-touch-icon" href="/logo192.png" />
        <link rel="manifest" href="/manifest.json" />
        <title>Henrik Klev</title>
        <script>
            // Apply a saved theme before the first paint to avoid a flash.
            try {
                const theme = localStorage.getItem('theme')
                if (theme === 'light' || theme === 'dark')
                    document.documentElement.dataset.theme = theme
            } catch {}
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
